tab_title_template "{index}:{title}"
tab_bar_min_tabs 2

map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5
map cmd+6 goto_tab 6
map cmd+7 goto_tab 7
map cmd+8 goto_tab 8
map cmd+9 goto_tab 9
map cmd+0 goto_tab -1
map cmd+shift+9 goto_tab 0
map cmd+shift+1 select_tab

map cmd+t new_tab
map cmd+shift+t new_tab
map cmd+enter new_window
map cmd+shift+enter new_window
map cmd+w close_tab
map cmd+shift+w close_os_window
map cmd+q quit

map cmd+d launch --location=vsplit --cwd=current
map cmd+shift+d launch --location=hsplit --cwd=current
map cmd+z toggle_layout stack

map shift+page_up scroll_page_up
map shift+page_down scroll_page_down
map cmd+page_up scroll_page_up
map cmd+page_down scroll_page_down

map alt+left neighboring_window left
map alt+right neighboring_window right
map alt+up neighboring_window up
map alt+down neighboring_window down
map alt+f toggle_fullscreen

map cmd+p command_palette

font_size        14
modify_font      line_height 110%

hide_window_decorations titlebar-only
window_padding_width 5
enabled_layouts splits,stack
copy_on_select yes
enable_audio_bell no

include ./theme.conf

background_opacity         1.0

font_family      family="BigBlueTermPlus Nerd Font Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
