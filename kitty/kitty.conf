font_family      family="BigBlueTermPlus Nerd Font"
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        14.0
modify_font      cell_height 110%

hide_window_decorations yes
window_padding_width 5
enabled_layouts splits,stack
copy_on_select yes
enable_audio_bell no

background_opacity         1.0
dynamic_background_opacity no
active_border_color #e6e6e6
inactive_border_color #3a3a3a
window_border_width 1pt

tab_bar_style fade
active_tab_foreground   #000000
active_tab_background   #e6e6e6
active_tab_font_style   bold
inactive_tab_foreground #7a7a7a
inactive_tab_background #0a0a0a
tab_bar_background      #000000

include ./theme.conf

map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5
map cmd+6 goto_tab 6
map cmd+7 goto_tab 7
map cmd+8 goto_tab 8
map cmd+9 goto_tab 9

map cmd+d launch --location=vsplit --cwd=current
map cmd+shift+d launch --location=hsplit --cwd=current
map cmd+w close_window
map cmd+z toggle_layout stack

map alt+left neighboring_window left
map alt+right neighboring_window right
map alt+up neighboring_window up
map alt+down neighboring_window down

map alt+f toggle_fullscreen